<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GRIOT NOIR | Supabase Directory</title>
<style>
:root{
  --bg:#07070c;
  --panel:#11111a;
  --line:#2e2e44;
  --text:#f2ead8;
  --dim:#a5a7bd;
  --cyan:#22e6f0;
  --magenta:#ff2e88;
  --acid:#d8ff3e;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,Cantarell,sans-serif;background:var(--bg);color:var(--text);line-height:1.5}
a{color:inherit}
.wrap{max-width:1100px;margin:0 auto;padding:24px 16px 48px}
.top{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.back{display:inline-block;color:var(--cyan);text-decoration:none;border:1px solid var(--line);padding:8px 10px}
.back:hover{border-color:var(--cyan)}
h1{font-size:clamp(28px,5vw,44px);letter-spacing:1px}
.meta{margin-top:8px;color:var(--dim);font-size:14px}
.search{margin-top:20px;display:flex;gap:8px}
.search input{flex:1;min-width:0;background:#0b0b13;color:var(--text);border:1px solid var(--line);padding:10px 12px;font-size:14px}
.search input:focus{outline:none;border-color:var(--cyan);box-shadow:0 0 0 2px rgba(34,230,240,.15)}
.list{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;margin-top:20px}
.card{background:var(--panel);border:1px solid var(--line);padding:14px}
.card h2{font-size:18px;line-height:1.3}
.card p{margin-top:8px;color:var(--dim);font-size:14px}
.card .row{margin-top:10px;font-size:12px;color:var(--dim)}
.chip{display:inline-block;margin-top:10px;padding:3px 7px;background:var(--acid);color:#000;font-size:11px;font-weight:700;letter-spacing:.5px}
.empty{margin-top:20px;border:1px dashed var(--line);padding:18px;color:var(--dim)}
</style>
</head>
<body>
  <main class="wrap">
    <div class="top">
      <h1>SUPABASE DISPATCH DIRECTORY</h1>
      <a class="back" href="/">← Back to front page</a>
    </div>
    <p class="meta" id="directoryMeta">Loading published dispatches from Supabase...</p>
    <label class="search" for="directorySearch">
      <input id="directorySearch" type="search" placeholder="Search by title, summary, category, tag..." aria-label="Search directory">
    </label>
    <section class="list" id="directoryList" aria-live="polite"></section>
    <div class="empty" id="directoryEmpty" hidden>No directory entries matched your search.</div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script type="module" src="./js/directory.js"></script>
</body>
</html>
